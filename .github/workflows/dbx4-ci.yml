name: DBX4 Production Build & Test
on:
  push:
    branches: [ phase15-production-recovery, phase14-verified, main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake
    - name: Configure CMake
      run: mkdir -p build && cd build && cmake -S .. -B .
    - name: Build
      run: cd build && cmake --build . -j$(nproc)
    - name: Run Tests
      run: cd build && ctest --timeout 120 --output-on-failure
